name: MacFinderPlus
options:
  bundleIdPrefix: com.qnsub
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Workbench:
    type: application
    platform: macOS
    sources:
      - Assets.xcassets
      - Sources
    entitlements:
      path: Workbench.entitlements
      properties:
        # The direct-download build retains unrestricted file browsing and terminal
        # features. These capabilities enable AV capture under hardened runtime.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Workbench
        CFBundleName: Workbench
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Cholo Asis. All rights reserved."
        NSCameraUsageDescription: Workbench uses the camera only when you record a video journal in Notes.
        NSMicrophoneUsageDescription: Workbench uses the microphone for narrated screen recordings, voice notes, and note attachments.
        NSScreenCaptureUsageDescription: Workbench captures only the screen, window, or area you request when making a screenshot or recording.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.qnsub.workbench.file-drag
            UTTypeDescription: Workbench File Drag
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        # Keep the compiled module aligned with the product name and shared scheme.
        PRODUCT_NAME: Workbench
        PRODUCT_MODULE_NAME: Workbench
        PRODUCT_BUNDLE_IDENTIFIER: com.qnsub.workbench.app
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Keep one stable identity for local runs and test hosts so macOS TCC
          # can remember Files & Folders permissions across rebuilds.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Ona Pacholo Asis (BJDV599QV2)"
          DEVELOPMENT_TEAM: TDXJZR8KA3
        Release:
          # Distribution packaging applies its final Developer ID signature.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
    postBuildScripts:
      - name: Stamp Build Information
        script: /bin/bash "$SRCROOT/script/write_build_metadata.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/WorkbenchBuildMetadata.plist
    scheme:
      testTargets:
        - WorkbenchTests
        - WorkbenchUITests
  WorkbenchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Workbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qnsub.workbench.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Workbench.app/Contents/MacOS/Workbench"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Ona Pacholo Asis (BJDV599QV2)"
          DEVELOPMENT_TEAM: TDXJZR8KA3
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
  WorkbenchUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Workbench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qnsub.workbench.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Workbench
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: Ona Pacholo Asis (BJDV599QV2)"
          DEVELOPMENT_TEAM: TDXJZR8KA3
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
